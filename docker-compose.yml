# Docker Compose V2 — Spring Boot 4.0.6 + MariaDB 11.8 + Redis 8

services:
  # MariaDB 11.8
  mariadb:
    image: wodby/mariadb:11.8
    container_name: mariadb-jasper
    restart: unless-stopped

    # 环境变量配置
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MARIADB_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MARIADB_USERNAME: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
      # === MariaDB 服务器参数优化 ===
      MYSQL_MAX_CONNECTIONS: 200
      MYSQL_INNODB_BUFFER_POOL_SIZE: 512M
      MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MYSQL_SLOW_QUERY_LOG: ON
      MYSQL_LONG_QUERY_TIME: 2

    # 端口映射（仅绑定到 localhost，提升安全性）
    ports:
      - "127.0.0.1:3306:3306"

    # 数据卷挂载
    volumes:
      - mariadb_data:/var/lib/mysql                                    # 数据库持久化存储
      - ./src/main/resources/ddl:/docker-entrypoint-initdb.d:ro        # 初始化脚本（只读）

    # 网络配置
    networks:
      - app-network

    # 健康检查（通过环境变量 MYSQL_PWD 避免密码暴露在命令行）
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=${DB_ROOT_PASSWORD} mariadb-admin ping -h localhost -uroot --silent || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 1024M

    # 日志配置（JSON 格式，自动轮转）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Spring Boot 4.0.6 + Jetty + Temurin 25
  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jasper-report-app
    restart: unless-stopped

    # 端口映射
    ports:
      - "8088:8088"

    # 环境变量配置
    environment:
      # 数据库连接配置
#      - SPRING_DATASOURCE_URL=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${TZ}&allowPublicKeyRetrieval=true&useSSL=${DB_SSL}
#      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
#      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
#      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
#      # Redis 连接配置（Docker 内部用服务名访问）
#      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
#      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
#      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # 系统配置
      - TZ=${TZ}
      # JVM 参数配置（从 .env 读取，便于调整）
      - JAVA_OPTS=-Xms${JAVA_XMS} -Xmx${JAVA_XMX} -XX:+UseG1GC -XX:MaxGCPauseMillis=${JAVA_MAX_GC_PAUSE}

    # 网络配置
    networks:
      - app-network

    # 日志目录挂载
    volumes:
      - ./logs:/app/logs

    # 应用健康检查（通过 Actuator 端点）
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 依赖关系：等待 MariaDB 和 Redis 都健康后再启动
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Redis 8 — token blacklist, cache, rate-limit

  redis:
    image: redis:8-alpine
    container_name: jasper-redis
    restart: unless-stopped

    # 端口映射（仅绑定到 localhost，提升安全性）
    ports:
      - "127.0.0.1:6379:6379"

    # 环境变量配置
    environment:
      - TZ=${TZ}

    # 启动命令
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

    # 数据卷挂载（持久化 RDB/AOF 文件）
    volumes:
      - redis_data:/data

    # 网络配置
    networks:
      - app-network

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# 数据卷定义
# ==============================================================================
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

# ==============================================================================
# 网络定义（桥接模式，实现容器间隔离通信）
# ==============================================================================
networks:
  app-network:
    driver: bridge
