server:
  port: 8088
  servlet:
    context-path: /api
#  address: 127.0.0.1

spring:
  application:
    name: jasper-report-api
  datasource:
    url: jdbc:mariadb://localhost:3306/debt_bills?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: jasper_user
    password: ENC(vs4g5IUa7nOVObexLFLfFFNNfrsTcRbMt0euIV7UaYJAU4/lQlXzvgzyLRnXQLOE)
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # MariaDB支持连接池
      minimum-idle: 5
      idle-timeout: 300000         # 5分钟
      max-lifetime: 1200000        # 20分钟
      connection-timeout: 30000    # 30秒
      pool-name: HikariCP-MariaDB
  sql:
    init:
      mode: always
      schema-locations: classpath:ddl/schema_mysql.sql
      data-locations: classpath:ddl/data_mysql.sql

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50            # MariaDB支持批量操作
          time_zone: UTC+8
        query:
          in_clause_parameter_padding: true
        order_inserts: true         # 优化批量插入
        order_updates: true         # 优化批量更新
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS  # 时间格式化格式
    time-zone: GMT+8  # 设置时区为东八区

# Jasypt
jasypt:
  encryptor:
    password: SecretKey_jasper_mariadb
logging:
  level:
    org.springframework.jdbc.datasource.init: INFO  # 打印脚本执行日志
    org.springframework.jdbc: TRACE  # 打印 SQL 执行细节
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.misyakuji: INFO
