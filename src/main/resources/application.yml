server:
  port: 8088
  servlet:
    context-path: /api
#  address: 127.0.0.1

spring:
  application:
    name: jasper-report-api
  config:
    import: optional:file:.env[.properties]

  cache:
    type: redis
    redis:
      time-to-live: 1800s
      cache-null-values: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${TZ}&useSSL=${DB_SSL:false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # MariaDB支持连接池
      minimum-idle: 5
      idle-timeout: 300000         # 5分钟
      max-lifetime: 1200000        # 20分钟
      connection-timeout: 30000    # 30秒
      pool-name: HikariCP-MariaDB
  sql:
    init:
      mode: never
      schema-locations: classpath:ddl/01-schema.sql
      data-locations: classpath:ddl/02-data.sql

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50            # MariaDB支持批量操作
          time_zone: UTC+8
        query:
          in_clause_parameter_padding: true
        order_inserts: true         # 优化批量插入
        order_updates: true         # 优化批量更新
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS  # 时间格式化格式
    time-zone: GMT+8  # 设置时区为东八区

app:
  jwtSecret: ${JWT_SECRET:a8f7b36e5c9d4b12a1fef52d9c4a8e9d3f1b6a2c5d8e4f9a7b3c1d6e8f5a4c7d}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

logging:
  # 使用logback-spring.xml配置文件
  config: classpath:logback-spring.xml
  # 基本日志级别配置（logback-spring.xml会根据环境进行详细配置）
  level:
    root: INFO
    com.misyakuji: INFO