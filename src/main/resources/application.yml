#      name: admin
#      password: 123456
  application:
    name: jasper-report-api
  datasource:
    url: jdbc:mariadb://localhost:3306/debt_bills?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: jasper_user
    password: ENC(vs4g5IUa7nOVObexLFLfFFNNfrsTcRbMt0euIV7UaYJAU4/lQlXzvgzyLRnXQLOE)
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # MariaDB支持连接池
      minimum-idle: 5
      idle-timeout: 300000         # 5分钟
      max-lifetime: 1200000        # 20分钟
      connection-timeout: 30000    # 30秒
      pool-name: HikariCP-MariaDB
  sql:
    init:
      mode: never
      schema-locations: classpath:ddl/schema.sql
      data-locations: classpath:ddl/data.sql

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50            # MariaDB支持批量操作
          time_zone: UTC+8
        query:
          in_clause_parameter_padding: true
        order_inserts: true         # 优化批量插入
        order_updates: true         # 优化批量更新
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS  # 时间格式化格式
    time-zone: GMT+8  # 设置时区为东八区

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.misyakuji.entity

app:
  jwtSecret: a8f7b36e5c9d4b12a1fef52d9c4a8e9d3f1b6a2c5d8e4f9a7b3c1d6e8f5a4c7d
  jwtExpirationMs: 86400000
